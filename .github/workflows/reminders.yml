# Sends WhatsApp/SMS reminders that have come due (1 day and 2 hours before a visit).
# Vercel's free plan only runs a cron once a day, so this calls the same endpoint every 5 minutes.
# Needs two repository secrets: APP_URL (e.g. https://abode-assist.vercel.app) and CRON_SECRET.
# Until both are set, the job does nothing and succeeds.
name: Send due reminders
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the reminder endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${APP_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "APP_URL and CRON_SECRET are not set; nothing to do."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 60 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/reminders"
